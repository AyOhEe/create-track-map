modLoader = "kotlinforforge"
loaderVersion="${kff_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/AyOhEe/create-track-map/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://github.com/AyOhEe/create-track-map"
authors = "${mod_authors}"
description = "${mod_description}"
logoFile = "assets/littlechasiu/ctm/static/assets/logo.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
mandatory = true
versionRange = "[${create_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
mandatory = true
versionRange = "[${kff_version},)"
ordering = "NONE"
side = "BOTH"
