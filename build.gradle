plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
    id "org.jetbrains.kotlin.jvm" version "2.3.0"
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Jar-in-Jar replaces shading in NeoGradle
jarJar.enable()

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()

    maven { url = "https://maven.neoforged.net/releases" } // NeoForge
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.createmod.net/"}  // Create, Ponder, Flywheel
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    devRuntime
    implementation.extendsFrom(devRuntime)
}

runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main

        dependencies {
            runtime project.configurations.devRuntime
        }
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation("net.neoforged:neoforge:${neo_version}")
    implementation("thedarkcolour:kotlinforforge-neoforge:$kff_version")

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")


    // Need transitive dependencies during compilation...
    compileOnly("io.ktor:ktor-server-cio-jvm:$ktor_version")
    compileOnly("io.ktor:ktor-server-core-jvm:$ktor_version")
    compileOnly("io.ktor:ktor-server-cors-jvm:$ktor_version")
    compileOnly("org.jetbrains.kotlin-wrappers:kotlin-css-jvm:$kotlin_css_version")

    // But non-transitive during development to prevent conflicts with KFF and kotlin stdlib...
    devRuntime("io.ktor:ktor-server-cio-jvm:$ktor_version") { transitive = false }
    devRuntime("io.ktor:ktor-server-core-jvm:$ktor_version") { transitive = false }
    devRuntime("io.ktor:ktor-server-cors-jvm:$ktor_version") { transitive = false }
    devRuntime("org.jetbrains.kotlin-wrappers:kotlin-css-jvm:$kotlin_css_version") { transitive = false }

    // And jar-in-jar'd in prod, which is automatically non-transitive.
    jarJar("io.ktor:ktor-events-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-http-cio-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-http-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-io-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-network-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-serialization-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-server-cio-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-server-core-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-server-cors-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-server-host-common-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-utils-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("io.ktor:ktor-websockets-jvm") {
        version {
            prefer "$ktor_version"
        }
    }
    jarJar("org.jetbrains.kotlin-wrappers:kotlin-css-jvm") {
        version {
            prefer "$kotlin_css_version"
        }
    }

    // included in Kotlin for Forge
    compileOnly("org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlin_json_version")
}

tasks.named('jarJar') {
    archiveFileName = "create-track-map-$mod_version+mc$minecraft_version-neoforge.jar"
}

jar {
    archiveFileName = "create-track-map-$mod_version+mc$minecraft_version-neoforge-slim.jar"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            kff_version            : kff_version,
            kff_version_range      : kff_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version         : create_version_short
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
